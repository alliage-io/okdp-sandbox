# TODO(no-kubocd): temporary registry, revert to quay.io/okdp once the OKDP charts are published there.
# The OKDP chart repositories (repo.alliage.io:8082) are reached over plain HTTP:
# one repository Secret per chart repository the components and services use.
---
apiVersion: v1
kind: Secret
metadata:
  name: okdp-sandbox-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: okdp-sandbox-charts
  # TODO(no-kubocd): temporary registry, revert to quay.io/okdp once the OKDP charts are published there.
  url: repo.alliage.io:8082/okdp/sandbox-charts
  enableOCI: "true"
  insecureOCIForceHttp: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: okdp-platform-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: okdp-platform-charts
  # TODO(no-kubocd): temporary registry, revert to quay.io/okdp once the OKDP charts are published there.
  url: repo.alliage.io:8082/okdp/platform-charts
  enableOCI: "true"
  insecureOCIForceHttp: "true"
