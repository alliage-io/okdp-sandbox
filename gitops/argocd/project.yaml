# Argo CD entry point. Bootstrap once with:
#   kubectl apply -n argocd -f gitops/argocd/
# then Application "okdp" (root.yaml) manages this directory from Git.
# The Git URL, branch and layout prefix ("gitops/") appear in root.yaml,
# platform-values.yaml, components.yaml and services.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: okdp
  namespace: argocd
spec:
  description: OKDP platform components and project services.
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
