# One Application <project>-<instance> per platform/components/<NN>-<i>/instance.yaml.
# Layer ordering: a RollingSync progressive sync by label okdp.io/layer (= NN), one
# step per layer (00, 10, 20, 30); a step starts when the previous one is Healthy.
# Requires progressive syncs to be enabled on the ApplicationSet controller
# (argocd-cmd-params-cm: applicationsetcontroller.enable.progressive.syncs: "true").
# Values layers: platform/platform-values.yaml, each platform/connections/<c>.yaml
# listed in instance.yaml "connections" (in order), then values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: okdp-components
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: http://gitea-http.gitea.svc.cluster.local:3000/okdp/okdp-sandbox.git
        revision: main
        files:
          - path: gitops/platform/components/*/instance.yaml
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - {key: okdp.io/layer, operator: In, values: ["00"]}
        - matchExpressions:
            - {key: okdp.io/layer, operator: In, values: ["10"]}
        - matchExpressions:
            - {key: okdp.io/layer, operator: In, values: ["20"]}
        - matchExpressions:
            - {key: okdp.io/layer, operator: In, values: ["30"]}
  template:
    metadata:
      name: '{{ .project }}-{{ .name }}'
      labels:
        okdp.io/project: '{{ .project }}'
        okdp.io/instance: '{{ .project }}-{{ .name }}'
        okdp.io/layer: '{{ regexFind "^[0-9]+" .path.basename }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ regexFind "^[0-9]+" .path.basename }}'
        # Diff as the API server would apply it (defaults and mutating webhooks such as
        # CloudNativePG's or trust-manager's), consistent with ServerSideApply=true.
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: okdp
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .project }}'
      ignoreDifferences:
        # Injected after the apply by cert-manager's cainjector, ingress-nginx's
        # certgen hook, trust-manager, kubauth...: self-heal would revert them.
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers: [/spec/conversion/webhook/clientConfig/caBundle]
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          # Large CRDs (CloudNativePG, External Secrets) exceed the client-side apply
          # annotation limit; Flux's helm-controller applies server-side too.
          - ServerSideApply=true
        retry:
          # Unlimited: a first install may wait for the platform (webhooks, CA bundle).
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    spec:
      sources:
        - repoURL: '{{ .chart | trimPrefix "oci://" | dir }}'
          chart: '{{ .chart | base }}'
          targetRevision: '{{ .version }}'
          helm:
            releaseName: '{{ .project }}-{{ .name }}'
            valueFiles:
              - '$values/{{ .path.path | dir | dir }}/platform-values.yaml'
            {{- range .connections }}
              - '$values/{{ $.path.path | dir | dir }}/connections/{{ . }}.yaml'
            {{- end }}
              - '$values/{{ .path.path }}/values.yaml'
        - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/okdp/okdp-sandbox.git
          targetRevision: main
          ref: values
