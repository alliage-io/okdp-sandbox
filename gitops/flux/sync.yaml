# Flux entry point. Bootstrap once with:
#   kubectl apply -f gitops/flux/sync.yaml
# then Flux manages this directory (Kustomization "okdp", path ./gitops/flux).
# Change the URL/branch here for another deployments repository; a repository with
# the layout at its root uses "./flux" (and okdp-gitops compile --path-prefix "").
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: okdp-gitops
  namespace: flux-system
spec:
  interval: 1m
  url: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-sandbox.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: okdp
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: okdp-gitops
  path: ./gitops/flux
  prune: true
