# Platform component 20-gitea: the upstream Gitea chart. The deployments Git repository of
# the sandbox: Flux or Argo CD read it at
# http://gitea-http.gitea.svc.cluster.local:3000/okdp/okdp-sandbox.git, the console writes
# to it (okdp-gitops-credentials). Bootstrapped once with helm (see README), then managed
# by the engine like any component. Web UI: https://gitea.okdp.sandbox.
# Sandbox credentials, assumed as such (same as okdp-gitops-credentials).
fullnameOverride: gitea
postgresql-ha: {enabled: false}
postgresql: {enabled: false}
valkey-cluster: {enabled: false}
valkey: {enabled: false}
test: {enabled: false}
persistence:
  enabled: true
  size: 2Gi
gitea:
  admin:
    username: okdp
    password: okdp-sandbox-Passw0rd
    email: okdp@okdp.io
  config:
    database: {DB_TYPE: sqlite3}
    session: {PROVIDER: memory}
    cache: {ADAPTER: memory}
    queue: {TYPE: level}
    server:
      ROOT_URL: https://gitea.okdp.sandbox/
    repository:
      # The first push creates okdp/okdp-sandbox, public: the engines read it anonymously.
      ENABLE_PUSH_CREATE_USER: true
      DEFAULT_PUSH_CREATE_PRIVATE: false
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: default-issuer
  hosts:
    - host: gitea.okdp.sandbox
      paths:
        - path: /
  tls:
    - secretName: gitea-tls
      hosts: [gitea.okdp.sandbox]
