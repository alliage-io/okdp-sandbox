# Platform component 30-okdp-control-plane-server: the OKDP chart
# okdp-control-plane-server (platform-packages). The console's API: it commits to the
# deployments repository served by 20-forgejo and reads the cluster.
gitops:
  repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-sandbox.git
  branch: main
  path: gitops
  # flux or argocd: set it to the engine that deploys this repository.
  engine: flux
  credentialsSecret: okdp-gitops-credentials
# User and group management through the Keycloak Admin API (URL and realm from the
# platform OIDC issuer). Self-signed sandbox certificate.
keycloak:
  credentialsSecret:
    name: okdp-control-plane-keycloak
  tlsInsecure: true
