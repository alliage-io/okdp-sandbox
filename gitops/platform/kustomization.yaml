# Engine-neutral: applied by Flux (Kustomization okdp-platform-values) and by Argo
# (Application okdp-platform-values). Publishes the platform values layer as a
# ConfigMap for Flux valuesFrom and for the control plane server.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: okdp-releases
configMapGenerator:
  - name: okdp-platform-values
    files:
      - values.yaml=platform-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
