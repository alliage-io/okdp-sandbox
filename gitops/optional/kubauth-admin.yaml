# Kubauth ships no bootstrap account, so nobody can sign in until these exist.
# Password is "password", bcrypt hashed. Regenerate with:
#   htpasswd -bnBC 10 "" <your-password> | tr -d ':\n'
apiVersion: kubauth.kubotal.io/v1alpha1
kind: User
metadata:
  name: useradmin
  namespace: kubauth-users
spec:
  name: Administrator
  emails:
    - useradmin@okdp.sandbox
  passwordHash: "$2a$10$3gH1eFQ2zm4Y3EoWqkKK0O.ECVSvQaz7Ox21yY4Hp2F/B3qWuGWIO"
---
apiVersion: kubauth.kubotal.io/v1alpha1
kind: Group
metadata:
  name: admins
  namespace: kubauth-users
spec:
  comment: Administrator group
---
apiVersion: kubauth.kubotal.io/v1alpha1
kind: GroupBinding
metadata:
  name: admin-useradmin
  namespace: kubauth-users
spec:
  user: useradmin
  group: admins
