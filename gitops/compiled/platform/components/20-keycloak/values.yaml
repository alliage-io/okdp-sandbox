    - apiVersion: batch/v1
      kind: Job
      metadata:
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
          helm.sh/hook-weight: "5"
        labels:
          app.kubernetes.io/component: keycloak-config-cli
          app.kubernetes.io/instance: keycloak-keycloak
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/name: keycloak
          app.kubernetes.io/part-of: okdp
          app.kubernetes.io/version: 7.3.2
          helm.sh/chart: keycloak-7.3.2-1.0.0
          okdp.io/instance: keycloak-keycloak
          okdp.io/service: keycloak
        name: keycloak-keycloak-config-cli
      spec:
        backoffLimit: 3
        template:
          metadata:
            annotations:
              checksum/realm: 1c8d0385f2898102bbec20c223e1baf2f991a24054bd907a332535c8c78dcb77
            labels:
              app.kubernetes.io/component: keycloak-config-cli
              app.kubernetes.io/instance: keycloak-keycloak
              app.kubernetes.io/managed-by: Helm
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/part-of: okdp
              app.kubernetes.io/version: 7.3.2
              helm.sh/chart: keycloak-7.3.2-1.0.0
              okdp.io/instance: keycloak-keycloak
              okdp.io/service: keycloak
          spec:
            automountServiceAccountToken: false
            containers:
              - env:
                  - name: KEYCLOAK_URL
                    value: http://keycloak-keycloak-http.keycloak.svc.cluster.local/
                  - name: KEYCLOAK_USER
                    value: admin
                  - name: KEYCLOAK_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        key: admin-password
                        name: keycloak-keycloak-admin
                  - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
                    value: "true"
                  - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
                    value: 300s
                  - name: IMPORT_FILES_LOCATIONS
                    value: /config/*
                image: quay.io/adorsys/keycloak-config-cli:6.5.1-26.5.5
                imagePullPolicy: IfNotPresent
                name: keycloak-config-cli
                resources:
                  limits:
                    cpu: "1"
                    memory: 768Mi
                  requests:
                    cpu: 250m
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  readOnlyRootFilesystem: true
                volumeMounts:
                  - mountPath: /tmp
                    name: tmp
                  - mountPath: /config
                    name: config
                    readOnly: true
            initContainers:
              - args:
                  - |
                    kcadm() { /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm.config; }
                    for i in $(seq 60); do
                      kcadm config credentials --server "$KEYCLOAK_URL" --realm master \
                        --user "$KEYCLOAK_USER" --password "$KEYCLOAK_PASSWORD" && break
                      [ "$i" -lt 60 ] || exit 1
                      sleep 5
                    done
                    policies=$(kcadm get components -r "$REALM" \
                      -q type=org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy \
                      --fields id,providerId,subType --format csv --noquotes)
                    for provider in $REMOVED_POLICIES; do
                      for id in $(printf '%s\n' "$policies" | grep ",$provider,anonymous$" | cut -d, -f1); do
                        echo "removing the anonymous client registration policy $provider ($id)"
                        kcadm delete "components/$id" -r "$REALM"
                      done
                    done
                command:
                  - /bin/bash
                  - -ec
                env:
                  - name: KEYCLOAK_URL
                    value: http://keycloak-keycloak-http.keycloak.svc.cluster.local/
                  - name: KEYCLOAK_USER
                    value: admin
                  - name: KEYCLOAK_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        key: admin-password
                        name: keycloak-keycloak-admin
                  - name: REALM
                    value: master
                  - name: REMOVED_POLICIES
                    value: consent-required scope
                  - name: HOME
                    value: /tmp
                image: quay.io/keycloak/keycloak:26.7.4
                imagePullPolicy: IfNotPresent
                name: dcr-policies
                resources:
                  limits:
                    cpu: "1"
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  readOnlyRootFilesystem: true
                volumeMounts:
                  - mountPath: /tmp
                    name: tmp
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            volumes:
              - emptyDir: {}
                name: tmp
              - name: config
                secret:
                  secretName: keycloak-keycloak-realm
okdpCharts:
  keycloakx: true
  okdp: true
