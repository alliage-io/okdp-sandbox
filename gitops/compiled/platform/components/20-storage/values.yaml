        provision.sh: |
          #!/bin/sh
          set -eu
          endpoint="http://default-storage-svc.default:9000"
          # call <method> <path> [curl args]: a request signed with the root identity;
          # fails with the server's answer on an HTTP error.
          call() {
            method=$1; path=$2; shift 2
            out=$(curl -sS --fail-with-body --aws-sigv4 "aws:amz:us-east-1:s3" --user "${ROOT_AK}:${ROOT_SK}" \
              -X "${method}" "$@" "${endpoint}${path}") || { echo "!! ${method} ${path}: ${out}" >&2; return 1; }
          }
          json_string() { printf '"%s"' "$(printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g')"; }
          # add_user <access key> <secret key> <policy>: creates or updates the user, sets its policy.
          add_user() {
            call PUT /rustfs/admin/v3/add-user --url-query "accessKey=$1" \
              --data-binary "{\"secretKey\":$(json_string "$2"),\"status\":\"enabled\"}"
            call PUT /rustfs/admin/v3/set-user-or-group-policy \
              --url-query "policyName=$3" --url-query "userOrGroup=$1" --url-query "isGroup=false"
          }
          add_policy() { call PUT /rustfs/admin/v3/add-canned-policy --url-query "name=$1" --data-binary "@$2"; }

          echo ">> waiting for RustFS at ${endpoint} ..."
          deadline=$(( $(date +%s) + 300 ))
          until call GET / 2>/dev/null; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              call GET /
              exit 1
            fi
            sleep 3
          done
          echo ">> creating buckets"
          call PUT /hive
          call PUT /hive --url-query policy= --data-binary @/policies/bucket-hive.json
          call PUT /spark-events
          call PUT /spark-events --url-query policy= --data-binary @/policies/bucket-spark-events.json
          call PUT /spark-events/event-logs/.keep --data-binary ''
          call PUT /lakehouse
          call PUT /lakehouse --url-query policy= --data-binary @/policies/bucket-lakehouse.json
          call PUT /bronze
          call PUT /bronze --url-query policy= --data-binary @/policies/bucket-bronze.json
          call PUT /silver
          call PUT /silver --url-query policy= --data-binary @/policies/bucket-silver.json
          call PUT /gold
          call PUT /gold --url-query policy= --data-binary @/policies/bucket-gold.json
          echo ">> creating users and policies from grants"
          echo "   platformAdmin (admin/sts: consoleAdmin)"
          add_user "$G0_AK" "$G0_SK" consoleAdmin
          echo "   hiveMetastore (okdp-hiveMetastore)"
          add_policy okdp-hiveMetastore /policies/policy-grant-1.json
          add_user "$G1_AK" "$G1_SK" okdp-hiveMetastore
          echo "   trino (admin/sts: consoleAdmin)"
          add_user "$G2_AK" "$G2_SK" consoleAdmin
          echo "   jupyterHub (okdp-jupyterHub)"
          add_policy okdp-jupyterHub /policies/policy-grant-3.json
          add_user "$G3_AK" "$G3_SK" okdp-jupyterHub
          echo "   sparkHistory (okdp-sparkHistory)"
          add_policy okdp-sparkHistory /policies/policy-grant-4.json
          add_user "$G4_AK" "$G4_SK" okdp-sparkHistory
          echo "   polaris (admin/sts: consoleAdmin)"
          add_user "$G5_AK" "$G5_SK" consoleAdmin
          echo "   examples (admin/sts: consoleAdmin)"
          add_user "$G6_AK" "$G6_SK" consoleAdmin
          echo ">> creating OIDC policies (claim values map onto these names)"
          add_policy platform_admin /policies/oidc-policy-platform_admin.json
          add_policy data_engineer /policies/oidc-policy-data_engineer.json
          add_policy data_scientist /policies/oidc-policy-data_scientist.json
          add_policy business_analyst /policies/oidc-policy-business_analyst.json
          add_policy data_steward /policies/oidc-policy-data_steward.json
          add_policy auditor /policies/oidc-policy-auditor.json
