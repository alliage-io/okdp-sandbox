          add_policy default-roles-master /policies/oidc-policy-default-roles-master.json
          add_policy offline_access /policies/oidc-policy-offline_access.json
          add_policy uma_authorization /policies/oidc-policy-uma_authorization.json
          echo ">> provisioning complete"
