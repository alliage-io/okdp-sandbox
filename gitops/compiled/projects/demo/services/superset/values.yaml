      path: /ws
      pathType: Prefix
    initContainers:
      - command:
          - /bin/bash
          - -c
          - |
            # See supersetNode.initContainers for the rationale.
            SECONDS=0
            until (exec 3<>/dev/tcp/"$REDIS_HOST"/"$REDIS_PORT") 2>/dev/null; do
              if [ "$SECONDS" -ge 120 ]; then
                echo "timeout waiting for redis at $REDIS_HOST:$REDIS_PORT after 120s" >&2
                exit 1
              fi
              echo "waiting for redis at $REDIS_HOST:$REDIS_PORT (elapsed ${SECONDS}s)"
              sleep 2
            done
            echo "redis at $REDIS_HOST:$REDIS_PORT is up"
        envFrom:
          - secretRef:
              name: '{{ tpl .Values.envFromSecret . }}'
        image: '{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}'
        imagePullPolicy: '{{ .Values.image.pullPolicy }}'
        name: wait-for-redis
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 128Mi
    livenessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: ws
      initialDelaySeconds: 5
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 1
    podAnnotations: {}
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    podLabels: {}
    podSecurityContext: {}
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: ws
      initialDelaySeconds: 5
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 1
    replicaCount: 1
    resources: {}
    service:
      annotations: {}
      nodePort:
        http: nil
      port: 8080
      type: ClusterIP
    startupProbe:
      failureThreshold: 60
      httpGet:
        path: /health
        port: ws
      initialDelaySeconds: 5
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 1
    strategy: {}
    topologySpreadConstraints: []
  supersetWorker:
    affinity: {}
    autoscaling:
      enabled: false
      maxReplicas: 100
      minReplicas: 1
      targetCPUUtilizationPercentage: 80
    command:
      - /bin/sh
      - -c
      - . {{ .Values.configMountPath }}/superset_bootstrap.sh; exec celery --app=superset.tasks.celery_app:app worker
    containerSecurityContext: {}
    deploymentAdditionalPodSpec: {}
    deploymentAnnotations: {}
    deploymentLabels: {}
    extraContainers: []
    extraInitContainers: []
    forceReload: false
    healthCheck:
      enabled: false
      livenessFile: /tmp/celery_worker_alive
      livenessHeartbeatInterval: 10
      readinessFile: /tmp/celery_worker_ready
    initContainers:
      - command:
          - /bin/bash
          - -c
          - |
            SECONDS=0
            wait_for() {
              local host=$1 port=$2 name=$3
              until (exec 3<>/dev/tcp/"$host"/"$port") 2>/dev/null; do
                if [ "$SECONDS" -ge 120 ]; then
                  echo "timeout waiting for $name at $host:$port after 120s" >&2
                  exit 1
                fi
                echo "waiting for $name at $host:$port (elapsed ${SECONDS}s)"
                sleep 2
              done
              echo "$name at $host:$port is up"
            }
            wait_for "$DB_HOST" "$DB_PORT" postgres
            wait_for "$REDIS_HOST" "$REDIS_PORT" redis
        envFrom:
          - secretRef:
              name: demo-superset-db-env
          - secretRef:
