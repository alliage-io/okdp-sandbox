            {   'name':'dex',
                'token_key':'access_token',
                'icon':'fa-address-card',
                'remote_app': {
                    'client_id': os.environ["AUTH_OAUTH_CLIENT_ID"],
                    'client_secret': os.environ["AUTH_OAUTH_CLIENT_SECRET"],
                    'client_kwargs':{
                        'scope': os.environ["AUTH_OAUTH_SCOPE"],
