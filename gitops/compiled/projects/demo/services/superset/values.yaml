      failureThreshold: 3
      initialDelaySeconds: 120
      periodSeconds: 60
      successThreshold: 1
      timeoutSeconds: 60
    podAnnotations: {}
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    podLabels: {}
    podSecurityContext: {}
    readinessProbe: {}
    replicas:
      enabled: true
      replicaCount: 1
    resources: {}
    startupProbe: {}
    strategy: {}
    topologySpreadConstraints: []
  tolerations: []
  topologySpreadConstraints: []
