polaris:
  advancedConfig:
    polaris.realm-context.header-name: Polaris-Realm
    quarkus.http.cors.enabled: "true"
  affinity: {}
  authentication:
    authenticator:
      type: default
    realmOverrides: {}
    tokenBroker:
      maxTokenGeneration: PT1H
      secret:
        privateKey: private.pem
        publicKey: public.pem
        rsaKeyPair:
          privateKey: private.pem
          publicKey: public.pem
        secretKey: symmetric.pem
        symmetricKey:
          secretKey: symmetric.key
      type: rsa-key-pair
    tokenService:
      type: default
    type: mixed
  autoscaling:
    enabled: false
    maxReplicas: 3
    minReplicas: 1
    targetCPUUtilizationPercentage: 80
  configMapLabels: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 10000
    seccompProfile:
      type: RuntimeDefault
  cors:
    accessControlAllowCredentials: true
    accessControlMaxAge: PT10M
    allowedHeaders:
      - Content-Type
      - Authorization
      - Polaris-Realm
      - X-Request-ID
    allowedMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowedOrigins:
      - https://polaris-console-demo.okdp.sandbox
    exposedHeaders:
      - '*'
