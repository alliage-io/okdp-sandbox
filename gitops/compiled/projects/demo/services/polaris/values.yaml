    - name: QUARKUS_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          key: client_id
          name: demo-polaris-demo-dcr
    - name: JAVA_TOOL_OPTIONS
      value: -Djavax.net.ssl.trustStore=/cacerts/bundle.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=
