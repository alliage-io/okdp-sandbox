      value: https://storage-default-api.okdp.sandbox
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          key: accessKey
          name: creds-polaris-s3
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          key: secretKey
          name: creds-polaris-s3
    - name: QUARKUS_DATASOURCE_JDBC_URL
      value: jdbc:postgresql://demo-pg-rw.demo.svc.cluster.local:5432/polaris
    - name: QUARKUS_DATASOURCE_USERNAME
      valueFrom:
        secretKeyRef:
          key: username
          name: creds-polaris-db
    - name: QUARKUS_DATASOURCE_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: creds-polaris-db
    - name: QUARKUS_OIDC_TLS_CONFIGURATION_NAME
      value: oidc
    - name: QUARKUS_TLS__OIDC__TRUST_STORE_PEM_CERTS
      value: /cacerts/ca.crt
    - name: QUARKUS_OIDC_TENANT-ENABLED
