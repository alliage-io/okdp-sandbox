# Checks the deployments repository layout (gitops/): shapes, connection contracts,
# Flux files generated by render-flux.sh up to date, kustomize builds, helm template
# of every instance with its values layers.

name: GitOps layout check

on:
  pull_request:
    paths:
      - "gitops/**"
      - ".github/workflows/gitops-check.yml"
  push:
    branches: [main]
    paths:
      - "gitops/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ⚡️
        uses: actions/checkout@v4

      - name: Set up kustomize and helm 🛠️
        run: |
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash -s -- 5.8.1 /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Check the layout ✅
        # yq v4 and jq are preinstalled on ubuntu-latest.
        run: gitops/scripts/check.sh --helm
