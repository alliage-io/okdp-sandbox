# Checks the deployments repository layout (gitops/): shapes, connection contracts,
# the compiled files up to date (okdp-gitops compile --check: every instance compiled
# against its chart), kustomize builds, helm template of every instance with its
# compiled values.
#
# okdp-gitops is built from okdp-control-plane-server, with okdp-compiler and
# okdp-lib-chart next to it (its go.mod replaces them). The OKDP charts not published
# on quay.io yet are taken from the packages the CI of their repositories pushes to
# ghcr.io (scripts/pull-charts.sh --map).

name: GitOps layout check

on:
  pull_request:
    paths:
      - "gitops/**"
      - ".github/workflows/gitops-check.yml"
  push:
    branches: [main]
    paths:
      - "gitops/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: v3.21.4   # same Helm 3 as OKDP/gh-workflows okdp-chart-ci.yml
  # TODO(okdp-compiler): main, then a release, once the okdp-compiler branches land.
  OKDP_CONTROL_PLANE_SERVER_REF: okdp-compiler
  # The OKDP charts, from the CI packages of their repositories until published.
  CHART_MIRRORS: >-
    --map oci://quay.io/okdp/platform-charts=oci://ghcr.io/okdp/platform-charts
    --map oci://quay.io/okdp/sandbox-dependencies=oci://ghcr.io/okdp/sandbox-dependencies
  KUSTOMIZE_VERSION: v5.8.1
  # sha256 of kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz, from the
  # release's checksums.txt. Update both together.
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ⚡️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Clone okdp-control-plane-server, okdp-compiler and okdp-lib-chart 📥
        run: |
          set -euo pipefail
          /usr/bin/git clone --depth 1 --branch "${OKDP_CONTROL_PLANE_SERVER_REF}" https://github.com/OKDP/okdp-control-plane-server.git ../okdp-control-plane-server
          /usr/bin/git clone --depth 1 https://github.com/OKDP/okdp-compiler.git ../okdp-compiler
          /usr/bin/git clone --depth 1 https://github.com/OKDP/okdp-lib-chart.git ../okdp-lib-chart

      - name: Set up Go 🛠️
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ../okdp-control-plane-server/go.mod
          cache: false

      - name: Build okdp-gitops 🛠️
        run: |
          set -euo pipefail
          (cd ../okdp-control-plane-server && go build -o "${RUNNER_TEMP}/bin/okdp-gitops" ./cmd/okdp-gitops)
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Set up helm 🛠️
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Pull the unpublished OKDP charts 📥
        run: |
          # Word splitting of CHART_MIRRORS is intended.
          # shellcheck disable=SC2086
          gitops/scripts/pull-charts.sh --mapped-only ${CHART_MIRRORS} "${RUNNER_TEMP}/charts"

      - name: Set up kustomize 🛠️
        run: |
          set -euo pipefail
          tgz="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "${RUNNER_TEMP}/${tgz}" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tgz}"
          echo "${KUSTOMIZE_SHA256}  ${RUNNER_TEMP}/${tgz}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tgz}" -C "${RUNNER_TEMP}" kustomize
          sudo install -m 0755 "${RUNNER_TEMP}/kustomize" /usr/local/bin/kustomize
          kustomize version; helm version

      - name: Check the layout ✅
        # yq v4 and jq are preinstalled on ubuntu-latest.
        run: gitops/scripts/check.sh --charts "${RUNNER_TEMP}/charts" --helm
