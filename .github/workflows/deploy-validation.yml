# End-to-end install validation of the deployments repository (gitops/), with both
# GitOps engines, as the README installs it:
#
#   1. kind cluster nokubocd-flux: Forgejo bootstrapped from the 20-forgejo component,
#      this commit pushed to it, Flux, gitops/flux/sync.yaml, wait for every
#      HelmRelease (gitops/scripts/e2e-kind.sh up flux);
#   2. kind cluster nokubocd-argocd: the same with Argo CD and gitops/argocd/;
#   3. gitops/scripts/compare-engines.sh: the live objects of every release must be
#      identical under both engines.
#
# The platform components only (E2E_SKIP_PROJECTS=1): two clusters with the demo
# project do not fit a hosted runner (about 32 GB each). The charts are the
# published ones (oci://quay.io/okdp/...): this workflow validates the deployment
# layer, not the charts, which their own repositories test.

name: Deploy validation (sandbox e2e, Flux and Argo CD)

on:
  pull_request:
    paths:
      - "gitops/**"
      - ".github/workflows/deploy-validation.yml"
  push:
    branches: [main]
    paths:
      - "gitops/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  E2E_DIR: ${{ github.workspace }}/.e2e
  E2E_SKIP_PROJECTS: "1"
  E2E_TIMEOUT: "2400"
  FLUX_VERSION: v2.9.5
  ARGOCD_VERSION: v3.4.2

jobs:
  deploy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ⚡️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free up disk space 📦
        uses: okdp/gh-workflows/.github/actions/free-disk-space@v1

      - name: Set up kind, helm and the Flux CLI 🛠️
        run: |
          curl -sSfLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind
          curl -sSfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -sSfL https://fluxcd.io/install.sh | bash -s -- --version "${FLUX_VERSION#v}"
          kind version; helm version; flux version --client

      - name: Deploy with Flux 🚀
        run: gitops/scripts/e2e-kind.sh up flux

      - name: Deploy with Argo CD 🚀
        run: gitops/scripts/e2e-kind.sh up argocd

      - name: Compare the two engines ✅
        env:
          # Expected differences, reported but not counted (docs/no-kubocd-e2e.md):
          # - the control plane server follows the engine: gitops.engine
          #   (GITOPS_ENGINE, the config checksum) and its engine RBAC;
          # - the External Secrets webhook certificate Secret, which the ESO
          #   cert-controller fills per cluster.
          COMPARE_EXPECTED: >-
            okdp-system/configmap/okdp-system-okdp-control-plane-server
            okdp-system/deployment.apps/okdp-system-okdp-control-plane-server
            okdp-system/clusterrole.rbac.authorization.k8s.io/okdp-system-okdp-control-plane-server
            external-secrets/secret/external-secrets-external-secrets-webhook
        run: |
          gitops/scripts/compare-engines.sh "$E2E_DIR/flux.kubeconfig" "$E2E_DIR/argocd.kubeconfig" \
            $(cd gitops && find platform/components -name instance.yaml | sort \
              | xargs -n1 yq '.project + "/" + .project + "-" + .name')

      - name: Diagnostics 🔎
        if: failure()
        run: |
          for engine in flux argocd; do
            kc="$E2E_DIR/$engine.kubeconfig"
            [[ -f "$kc" ]] || continue
            echo "======== $engine"
            kubectl --kubeconfig "$kc" get pods -A || true
            kubectl --kubeconfig "$kc" get helmreleases.helm.toolkit.fluxcd.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get kustomizations.kustomize.toolkit.fluxcd.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get applications.argoproj.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get events -A --sort-by=.lastTimestamp | tail -n 100 || true
          done
