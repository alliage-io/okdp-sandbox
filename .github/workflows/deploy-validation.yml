# End-to-end install validation of the deployments repository (gitops/), with both
# GitOps engines, as the README installs it:
#
#   1. kind cluster nokubocd-flux: Forgejo bootstrapped from the 20-forgejo component,
#      this commit pushed to it, Flux, gitops/flux/sync.yaml, wait for every
#      HelmRelease (gitops/scripts/e2e-kind.sh up flux);
#   2. kind cluster nokubocd-argocd: the same with Argo CD and gitops/argocd/;
#   3. gitops/scripts/compare-engines.sh: the live objects of every release must be
#      identical under both engines.
#
# The platform components only (E2E_SKIP_PROJECTS=1): two clusters with the demo
# project do not fit a hosted runner (about 32 GB each). This workflow validates the
# deployment layer, not the charts, which their own repositories test. The OKDP
# charts not published on quay.io yet are the packages the CI of their repositories
# pushes to ghcr.io, served by a local plain-HTTP registry (nokubocd-registry:5000)
# and compiled into the layout by e2e-kind.sh (okdp-gitops). The control plane
# server is built from okdp-control-plane-server (it compiles what it writes) and
# loaded into kind.

name: Deploy validation (sandbox e2e, Flux and Argo CD)

on:
  pull_request:
    paths:
      - "gitops/**"
      - ".github/workflows/deploy-validation.yml"
  push:
    branches: [main]
    paths:
      - "gitops/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  E2E_DIR: ${{ github.workspace }}/.e2e
  E2E_SKIP_PROJECTS: "1"
  E2E_TIMEOUT: "2400"
  FLUX_VERSION: v2.9.5
  ARGOCD_VERSION: v3.4.2
  HELM_VERSION: v3.21.4   # same Helm 3 as OKDP/gh-workflows okdp-chart-ci.yml
  KIND_VERSION: v0.33.0
  # sha256 of kind-linux-amd64 ${KIND_VERSION}, from the release's
  # kind-linux-amd64.sha256sum. Update both together.
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  # TODO(okdp-compiler): main, then a release, once the okdp-compiler branches land.
  OKDP_CONTROL_PLANE_SERVER_REF: okdp-compiler
  CHART_MIRRORS: >-
    --map oci://quay.io/okdp/platform-charts=oci://ghcr.io/okdp/platform-charts
    --map oci://quay.io/okdp/sandbox-dependencies=oci://ghcr.io/okdp/sandbox-dependencies
  E2E_CHART_MAP: oci://quay.io/okdp=oci://nokubocd-registry:5000/okdp
  E2E_PLAIN_HTTP_REGISTRY: nokubocd-registry:5000
  E2E_REGISTRY_CONTAINER: nokubocd-registry
  E2E_REGISTRY_HOST: 127.0.0.1:5001
  E2E_SERVER_IMAGE: okdp-control-plane-server:e2e
  E2E_LOAD_IMAGES: okdp-control-plane-server:e2e

jobs:
  deploy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ⚡️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free up disk space 📦
        uses: okdp/gh-workflows/.github/actions/free-disk-space@v1

      - name: Set up helm 🛠️
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up the Flux CLI 🛠️
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
        with:
          version: ${{ env.FLUX_VERSION }}

      - name: Set up kind 🛠️
        run: |
          set -euo pipefail
          curl -sSfLo "${RUNNER_TEMP}/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ${RUNNER_TEMP}/kind" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/kind" /usr/local/bin/kind
          kind version; helm version; flux version --client

      - name: Clone okdp-control-plane-server, okdp-compiler and okdp-lib-chart 📥
        run: |
          set -euo pipefail
          /usr/bin/git clone --depth 1 --branch "${OKDP_CONTROL_PLANE_SERVER_REF}" https://github.com/OKDP/okdp-control-plane-server.git ../okdp-control-plane-server
          /usr/bin/git clone --depth 1 https://github.com/OKDP/okdp-compiler.git ../okdp-compiler
          /usr/bin/git clone --depth 1 https://github.com/OKDP/okdp-lib-chart.git ../okdp-lib-chart

      - name: Set up Go 🛠️
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ../okdp-control-plane-server/go.mod
          cache: false

      - name: Build okdp-gitops and the control plane server image 🛠️
        run: |
          set -euo pipefail
          (cd ../okdp-control-plane-server && go build -o "${RUNNER_TEMP}/bin/okdp-gitops" ./cmd/okdp-gitops)
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          docker build -t "${E2E_SERVER_IMAGE}" \
            --build-context okdp-lib=../okdp-lib-chart --build-context okdp-compiler=../okdp-compiler \
            ../okdp-control-plane-server

      - name: Serve the unpublished OKDP charts from a local registry 📦
        run: |
          set -euo pipefail
          # Word splitting of CHART_MIRRORS is intended.
          # shellcheck disable=SC2086
          gitops/scripts/pull-charts.sh --mapped-only ${CHART_MIRRORS} "${RUNNER_TEMP}/charts"
          echo "E2E_CHARTS=${RUNNER_TEMP}/charts" >> "${GITHUB_ENV}"
          docker run -d --name "${E2E_REGISTRY_CONTAINER}" -p "${E2E_REGISTRY_HOST}:5000" registry:2

      - name: Deploy with Flux 🚀
        run: gitops/scripts/e2e-kind.sh up flux

      - name: Deploy with Argo CD 🚀
        run: gitops/scripts/e2e-kind.sh up argocd

      - name: Compare the two engines ✅
        env:
          # Expected differences, reported but not counted (docs/no-kubocd-e2e.md):
          # - the control plane server follows the engine: gitops.engine
          #   (GITOPS_ENGINE, the config checksum) and its engine RBAC;
          # - the External Secrets webhook certificate Secret, which the ESO
          #   cert-controller fills per cluster.
          COMPARE_EXPECTED: >-
            okdp-system/configmap/okdp-system-okdp-control-plane-server
            okdp-system/deployment.apps/okdp-system-okdp-control-plane-server
            okdp-system/clusterrole.rbac.authorization.k8s.io/okdp-system-okdp-control-plane-server
            external-secrets/secret/external-secrets-external-secrets-webhook
        run: |
          gitops/scripts/compare-engines.sh "$E2E_DIR/flux.kubeconfig" "$E2E_DIR/argocd.kubeconfig" \
            $(cd gitops && find platform/components -name instance.yaml | sort \
              | xargs -n1 yq '.project + "/" + .project + "-" + .name')

      - name: Diagnostics 🔎
        if: failure()
        run: |
          for engine in flux argocd; do
            kc="$E2E_DIR/$engine.kubeconfig"
            [[ -f "$kc" ]] || continue
            echo "======== $engine"
            kubectl --kubeconfig "$kc" get pods -A || true
            kubectl --kubeconfig "$kc" get helmreleases.helm.toolkit.fluxcd.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get kustomizations.kustomize.toolkit.fluxcd.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get applications.argoproj.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get events -A --sort-by=.lastTimestamp | tail -n 100 || true
          done
